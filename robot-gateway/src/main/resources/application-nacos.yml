spring:
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ROBOT_CLOUD
    sentinel:
      datasource:
        gw-flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:}
            groupId: SENTINEL_GATEWAY_GROUP
            dataId: robot-gateway-flow-rules
            rule-type: gw-flow
