name: Verify Robot Cloud
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4.11@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-ci-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pephemeral-ci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4.11@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
        ports:
          - 16379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Install pinned backend development tools
        env:
          HUSKY: '0'
        run: bun install --frozen-lockfile
      - name: Commit format, real hook behavior and adopted BD assets
        run: |
          bun run check:commits
          bun run test:tooling
          bun run bd check --target . --json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Same local Java17 quality, full schema and isolated upgrade entry
        env:
          ROBOT_VERIFY_MYSQL_HOST: 127.0.0.1
          ROBOT_VERIFY_MYSQL_PORT: '3306'
          ROBOT_VERIFY_MYSQL_USER: root
          ROBOT_VERIFY_MYSQL_PASSWORD: ephemeral-ci-only
        run: scripts/verify.sh --mysql-upgrade
      - name: Actual packaged Auth reliable Redis state and audit contract
        env:
          ROBOT_VERIFY_REDIS_DISPOSABLE: '1'
          ROBOT_VERIFY_REDIS_HOST: 127.0.0.1
          ROBOT_VERIFY_REDIS_PORT: '16379'
        run: |
          export ROBOT_VERIFY_REDIS_NAMESPACE="$(python3 -c 'import secrets; print("verify-" + secrets.token_hex(6))')"
          scripts/verify-auth-redis.sh full
      - name: Full native BD evidence and Robot generic rule gate
        if: always()
        run: bun run check:bd
      - name: Retain actual test reports and artifact hashes even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
            **/target/checkstyle-result.xml
            **/target/pmd.xml
            **/target/spotbugsXml.xml
            **/target/site/jacoco/jacoco.xml
            target/bom.json
            target/verification/*.json
            target/verification/*.log
