server:
  port: 9202

spring:
  http:
    converters:
      preferred-json-mapper: jackson2
    codecs:
      preferred-json-mapper: jackson2
  jdbc:
    template:
      query-timeout: 5s
  application:
    name: robot-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ROBOT_CLOUD
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      eager: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_JDBC_URL:jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:robot_cloud}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&connectTimeout=3000&socketTimeout=8000}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: robot-system-hikari
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 5000
      connection-test-query: SELECT 1
      # 统一DB相对时钟，限制锁等待/SELECT；driver网络超时独立于获取连接预算。
      connection-init-sql: "SET SESSION time_zone = '+00:00', SESSION innodb_lock_wait_timeout = 5, SESSION MAX_EXECUTION_TIME = 5000"
  flyway:
    user: ${MYSQL_MIGRATION_USERNAME:${MYSQL_USERNAME:root}}
    password: ${MYSQL_MIGRATION_PASSWORD:${MYSQL_PASSWORD:root}}
    enabled: true
    locations: classpath:db/migration
    # 非空无历史的数据库必须经迁移评审，不能由应用启动自动接管。
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      ssl:
        enabled: ${REDIS_SSL:false}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.robot.system.api.entity
  global-config:
    banner: false
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleteFlag
      logic-delete-value: 0
      logic-not-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 1800
  active-timeout: -1
  is-concurrent: true
  is-log: false
  token-style: uuid
  is-read-cookie: false
  is-read-header: true

robot:
  env: ${ROBOT_ENV:local}
  management:
    secret: ${ROBOT_MANAGEMENT_SECRET:}
  production:
    redis-isolated: ${ROBOT_REDIS_ISOLATED:false}
    bootstrap-complete: ${ROBOT_BOOTSTRAP_COMPLETE:false}
  bootstrap:
    platform-admin-enabled: ${ROBOT_PLATFORM_ADMIN_BOOTSTRAP:false}
    platform-admin-user-id: ${ROBOT_PLATFORM_ADMIN_USER_ID:}
    platform-admin-password: ${ROBOT_PLATFORM_ADMIN_BOOTSTRAP_PASSWORD:}
  security:
    inner-secret: ${ROBOT_INNER_SECRET:robot-inner-dev-secret}
    exclude-paths:
      - /actuator/**
      - /v3/api-docs/**
      - /doc.html
      - /webjars/**
      - /inner/**
  mybatis:
    tenant:
      enabled: true
      ignore-tables:
        - sys_tenant
        - sys_company
        - sys_user
        - sys_user_company
        - sys_menu
        - sys_role_menu
        - sys_role_button
        - sys_menu_button
        - sys_dict_type
        - sys_dict_item

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5level [%X{traceId:-}] [%thread] %logger{40} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    sentinel:
      enabled: false
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false

management:
  health:
    sentinel:
      enabled: false
    nacos-discovery:
      enabled: false
